# ============================================================
# Coolify "Docker Compose Empty" — cole este YAML no editor
# Domínio: https://apicrm.euapoio.cloud → gateway:80
# Obrigatório no Environment:
#   DATABASE_URL=postgres://postgres:SENHA@HOST_INTERNO:5432/wacrm
#   (copie a Postgres URL internal do wacrm-db; DB = wacrm)
#   JWT_SECRET, ANON_KEY, SERVICE_ROLE_KEY, SECRET_KEY_BASE
#   SITE_URL, API_EXTERNAL_URL
# ============================================================

services:
  gateway:
    image: caddy:2.8-alpine
    restart: unless-stopped
    user: root
    expose:
      - "80"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/Caddyfile <<'EOF'
        {
        	admin off
        }
        :80 {
        	@preflight {
        		method OPTIONS
        	}
        	handle @preflight {
        		header Access-Control-Allow-Origin "{header.origin}"
        		header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        		header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept, prefer, x-supabase-auth"
        		header Access-Control-Allow-Credentials "true"
        		header Access-Control-Max-Age "86400"
        		respond 204
        	}
        	header Access-Control-Allow-Origin "{header.origin}"
        	header Access-Control-Allow-Credentials "true"
        	header Access-Control-Expose-Headers "content-range, x-supabase-api-version"

        	handle_path /auth/v1/* {
        		reverse_proxy auth:9999 {
        			header_down -Access-Control-Allow-Origin
        			header_down -Access-Control-Allow-Credentials
        			header_down -Access-Control-Allow-Headers
        			header_down -Access-Control-Allow-Methods
        			header_down -Access-Control-Expose-Headers
        		}
        	}
        	handle_path /rest/v1/* {
        		reverse_proxy rest:3000 {
        			header_down -Access-Control-Allow-Origin
        			header_down -Access-Control-Allow-Credentials
        			header_down -Access-Control-Allow-Headers
        			header_down -Access-Control-Allow-Methods
        			header_down -Access-Control-Expose-Headers
        		}
        	}
        	handle_path /realtime/v1/* {
        		rewrite * /socket{uri}
        		reverse_proxy realtime:4000 {
        			header_down -Access-Control-Allow-Origin
        			header_down -Access-Control-Allow-Credentials
        			header_down -Access-Control-Allow-Headers
        			header_down -Access-Control-Allow-Methods
        			header_down -Access-Control-Expose-Headers
        		}
        	}
        	handle_path /storage/v1/* {
        		reverse_proxy storage:5000 {
        			header_down -Access-Control-Allow-Origin
        			header_down -Access-Control-Allow-Credentials
        			header_down -Access-Control-Allow-Headers
        			header_down -Access-Control-Allow-Methods
        			header_down -Access-Control-Expose-Headers
        		}
        	}
        	handle /health {
        		respond "ok" 200
        	}
        	handle {
        		respond "WACRM API" 404
        	}
        }
        EOF
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    depends_on:
      - auth
      - rest
      - realtime
      - storage
    networks:
      - coolify

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      # search_path=auth é obrigatório — senão enums/tabelas vão para public e quebram MFA
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/wacrm?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
    networks:
      - coolify

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/wacrm
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    networks:
      - coolify

  realtime:
    image: supabase/realtime:v2.34.47
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: wacrm
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      APP_NAME: realtime
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    networks:
      - coolify

  storage:
    image: supabase/storage-api:v1.22.7
    restart: unless-stopped
    depends_on:
      - rest
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - wacrm_storage:/var/lib/storage
    networks:
      - coolify

volumes:
  wacrm_storage:

networks:
  coolify:
    external: true
